[package]
name = "agent-companion"
version = "0.2.3"
description = "A living pixel-art desktop companion"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ECHO"
path = "src/main.rs"

# Without custom-protocol a build LOADS THE DEV SERVER (localhost:1420) instead
# of the embedded dist — a blank window on any machine that isn't running vite.
# Default it on so a plain `cargo build --release` produces a shippable exe;
# `tauri dev` still disables defaults itself.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
rand = "0.8"
base64 = "0.22"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
